name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci
      - run: npx prisma generate
      - run: npm run typecheck
      # Unit tests, including data checks against the bundled ATT&CK release
      # and the official Sigma taxonomy
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  sigma-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sigma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt httpx
      - name: Convert a sample rule to every target
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app import app
          c = TestClient(app)
          rule = """
          title: t
          logsource: {product: windows, category: process_creation}
          detection: {sel: {Image|endswith: '\\\\cmd.exe'}, condition: sel}
          """
          for t in c.get('/targets').json():
              r = c.post('/convert', json={'rule': rule, 'target': t['id']})
              assert r.status_code == 200 and r.json()['queries'], (t['id'], r.text)
              print(t['id'], r.json()['queries'][0])
          PY

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh backend/entrypoint.sh
      - run: docker compose config -q && docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
