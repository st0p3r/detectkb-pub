server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version
    server_tokens off;

    # Backup restore (50 MB) and reference dataset uploads (up to 100 MB)
    client_max_body_size 100m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Security headers (repeated in each location: add_header there replaces the server-level set).
    # CSP: scripts only from this origin; fonts from Google Fonts; inline style attributes are
    # used by React components; data:/blob: images for graph exports. No framing (clickjacking).
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths → index.html (React Router handles routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api requests to the backend service
    location /api {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace, don't append: a client-supplied X-Forwarded-For must not change the IP the
        # backend sees (the login rate limit and the audit log are keyed on it)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # The server-level headers above already cover these
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
    }
}
