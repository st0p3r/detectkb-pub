# ─────────────────────────────────────────────────────────────────────────────
# DetectKB — Docker Compose
#
# Dev usage (hot-reload, source-mounted):
#   docker-compose up
#
# Prod usage (nginx-served frontend, no volume mounts):
#   docker-compose --profile prod up
#   The 'frontend-prod' service replaces 'frontend' in production.
#   Build it first: docker-compose --profile prod build frontend-prod
#
# Individual service:
#   docker-compose up mysql -d        # MySQL only
#   docker-compose up mysql backend   # API + DB, no frontend container
# ─────────────────────────────────────────────────────────────────────────────
version: '3.9'
services:
  mysql:
    image: mysql:8.0
    container_name: detectkb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-detectkb}
      MYSQL_USER: ${MYSQL_USER:-detectkb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-detectkb}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: detectkb-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-detectkb}:${MYSQL_PASSWORD:-detectkb}@mysql:3306/${MYSQL_DATABASE:-detectkb}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-detectkb-dev-secret-change-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-detectkb}
      BACKUP_DIR: /backups
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Dev frontend: Vite dev server with hot-reload ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: detectkb-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:3001

  # ── Prod frontend: nginx static build (use --profile prod) ────────────────
  frontend-prod:
    profiles:
      - prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: detectkb-frontend-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  mysql_data:
