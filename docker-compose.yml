# ─────────────────────────────────────────────────────────────────────────────
# DetectKB — Docker Compose (production)
#
#   docker compose up -d --build        # MySQL + API + nginx frontend
#
# Development (hot reload, source mounted) — layer the dev override on top:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# All settings come from .env (see .env.example, or run ./install.sh).
# ─────────────────────────────────────────────────────────────────────────────
name: detectkb

services:
  mysql:
    image: mysql:8.0
    container_name: detectkb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-detectkb}
      MYSQL_USER: ${MYSQL_USER:-detectkb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-detectkb}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: detectkb-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-detectkb}:${MYSQL_PASSWORD:-detectkb}@mysql:3306/${MYSQL_DATABASE:-detectkb}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:-detectkb-dev-secret-change-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-detectkb}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@detectkb.local}
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: detectkb-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"

volumes:
  mysql_data:
